<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="📻">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <title>📻</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📻</text></svg>">
    
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/zmobilu/assets/main/kiosk-ikona.png">
    <meta property="og:image" content="https://raw.githubusercontent.com/zmobilu/assets/main/kiosk-ikona.png?v=2">
    
    <style>
        /* --- CENTRÁLNE RIADENÁ FARBA NOČNÉHO REŽIMU --- */
        :root {
            --night-color: #ffff00;
        }
        
        /* Globálna zmena kurzora na ručičku pre všetky interaktívne prvky */
        button,
        a,
        [onclick],
        .fav-card,
        .cfg-mini-card,
        .forecast-day-box,
        .color-dot,
        .weather-left-side,
        .big-clock-time,
        .big-clock-nameday {
            cursor: pointer !important;
        }

        /* Okamžitá reakcia na dotyk prsta */
        .fav-card:active,
        .forecast-day-box:active,
        .btn-settings:active,
        #weather-location-main:active {
            transform: scale(0.96);
            opacity: 0.8;
        }
                
        /* --- RESET A ZÁKLADNÉ NASTAVENIE --- */
        body {
            margin: 0; padding: 0; background-color: #000; color: #fff;
            font-family: -apple-system-short-condensed, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; height: 100vh; width: 100vw;
            overflow: hidden; box-sizing: border-box; -webkit-user-select: none; user-select: none;
            position: fixed; top: 0; left: 0; bottom: 0; right: 0;
        }
        
        /* --- PERMANENTNÉ UKOTVENIE NASTAVENÍ VPRAVO HORE --- */
        .btn-settings { 
            position: absolute !important;
            top: 10px !important;
            right: 15px !important;
            z-index: 999999 !important;
            background: #111 !important; 
            border: 1px solid #222 !important; 
            color: #666; 
            font-size: 30px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            width: 44px; 
            height: 44px; 
            border-radius: 50%;
            margin: 0 !important;
            transition: color 0.2s, background 0.2s, border-color 0.2s; 
        }
        /* --- ODZNAK ČÍSLA POZÍCIE V NASTAVENIACH --- */
        .cfg-slot-badge {
            position: absolute;
            top: 4px;
            right: 6px;
            background: #ff9f0a;
            color: #000;
            font-size: 11px;
            font-weight: 800;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 6px rgba(0,0,0,0.8);
            z-index: 5;
        }
        .btn-settings.active { color: #ff9f0a; border-color: #ff9f0a; background: #1a1a1a; }
        #fullscreenToggleBtn.active { color: #ff9f0a; border-color: #ff9f0a; background: #1a1a1a; }
        #fullscreenToggleBtn {
            position: absolute !important;
            top: 60px !important;
            right: 15px !important;
            z-index: 999999 !important;
        }

        /* --- HLAVNÁ ROZDELENÁ PLOCHA --- */
        .workspace-container { display: flex; flex: 1; width: 100vw; height: 100vh; overflow: hidden; position: relative; }
        .main-content-area {
            position: relative !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
        }

        /* --- INFOPÁSIK VĽAVO HORE (IKONA + NÁZOV HRAJÚCEHO RÁDIA) --- */
        .radio-trigger-bar {
            position: absolute;
            top: 10px;
            left: 15px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer !important;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 16px 6px 6px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        
        .radio-trigger-bar:active {
            background: rgba(255, 159, 10, 0.2);
        }
        
        .radio-trigger-icon {
            font-size: 36px;
            line-height: 1;
        }
        
        .radio-trigger-text {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ff9f0a;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* --- PANEL RÁDIÍ AKO PREKRYTIE (OVERLAY) --- */
        /* --- PANEL RÁDIÍ (ZÁKLAD PRE LANDSCAPE - VYSÚVANIE ZĽAVA) --- */
        .favorites-sidebar {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 280px !important;
            height: 100vh !important;
            z-index: 99999 !important;
            background: rgba(5, 5, 5, 0.98) !important;
            border-right: 1px solid #222;
            box-shadow: 10px 0 25px rgba(0,0,0,0.8);
            
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            grid-template-rows: repeat(3, 1fr) !important;
            gap: 10px !important;
            padding: 60px 10px 20px 10px !important;
            box-sizing: border-box !important;
        
            /* Na šírku sa schová vľavo mimo obrazovku */
            transform: translateX(-100%) !important;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1) !important;
        }
        
        .favorites-sidebar.open {
            transform: translateX(0) !important;
        }

        .fav-card {
            background: #111; border: 1px solid #222; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; padding: 6px; box-sizing: border-box; position: relative; overflow: hidden;
            transition: transform 0.1s, border-color 0.15s;
        }
        .fav-card:not(.empty):active { transform: scale(0.97); }
        .fav-card img { width: 75%; height: 75%; object-fit: contain; }
        .fav-card i { font-size: 30px; }
        .fav-card span { font-size: 11px; font-weight: 600; text-transform: uppercase; text-align: center; margin-top: 2px; }
        .fav-card.empty { border: 1px dashed #222; background: transparent; cursor: default; }
        .fav-card.empty i { color: #333; font-size: 22px; }

        /* Mriežka nastavení */
        .settings-grid-view {
            display: grid !important;
            position: absolute !important;
            top: 0 !important;
            bottom: 0 !important;
            left: 280px !important;
            right: 0 !important;
            width: auto !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 10px !important;
            padding-right: calc(10px + env(safe-area-inset-right)) !important;
            box-sizing: border-box !important;
            background: #090909 !important;
            z-index: 999999 !important;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 8px;
            align-content: start;
            overflow-y: auto !important;

            opacity: 0;
            visibility: hidden;
            transform: translateX(15px);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out, visibility 0.3s;
        }
        
        .settings-grid-view.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        /* --- HLAVNÝ CONTAINER A OBSAH (ZÁKLAD) --- */
        .placeholder-view {
            display: flex !important;
            width: 100% !important;
            height: 100% !important;
            box-sizing: border-box !important;
            padding: 3vh 3vw !important;
            overflow: hidden !important;
            background: #000;
        }

        /* Stredný stĺpec hodín a dátumu */
        .clock-middle-container {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            width: 100%;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
        }

        .clock-row-container {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 100% !important;
            line-height: 1 !important;
        }

        .date-row-container {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 100% !important;
            margin-top: 2vh !important;
        }

        /* Samotné hodiny */
        .big-clock-time {
            font-size: clamp(80px, 18vw, 280px) !important;
            font-weight: 800 !important;
            display: flex !important;
            letter-spacing: -2px !important;
            justify-content: center !important;
            align-items: center !important;
            width: 100% !important;
            margin: 0 !important;
            line-height: 0.9;
            transform: none !important;
        }

        .big-clock-hours { color: #fff; letter-spacing: 2px !important; }
        .big-clock-minutes { color: #fff; font-weight: 200; margin-left: 10px; letter-spacing: 2px !important; }

        /* Obal pre dátum a meniny */
        .big-clock-date-wrapper {
            font-size: clamp(16px, 3.2vw, 48px) !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            text-align: center !important;
            gap: 8px 12px !important;
            font-weight: 700 !important;
            width: 100% !important;
            margin: 0 !important;
            transform: none !important;
            white-space: nowrap !important;
        }

        .big-clock-city { color: #ff9f0a; font-weight: bold; letter-spacing: 2px; }
        .big-clock-date { color: #fff; }
        .big-clock-nameday { color: #ff9f0a; }

        /* --- HLAVNÝ POČASIE CONTAINER --- */
        .main-weather-container {
            font-size: clamp(14px, 2vw, 28px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .weather-left-side {
            display: flex !important;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100% !important;
            padding: 0 !important;
            box-sizing: border-box;
        }

        /* --- UPRATANÁ A VYBALANSOVANÁ SEKCIA POČASIA --- */
        .weather-top-row {
            display: flex;
            flex-direction: column !important; /* Ikona nad riadkom s teplotou */
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }
        
        #mainBigIcon {
            font-size: clamp(3.5rem, 11vh, 6.5rem) !important;
            line-height: 1;
            margin-bottom: 6px !important; /* Odstup ikony od čísiel */
        }
        
        /* Riadok, kde je hlavná teplota vedľa dvoch menších údajov */
        .weather-core-row {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 12px !important;
        }
        
        #mainBigTemp {
            font-size: clamp(3rem, 11vh, 6.5rem) !important;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap !important;
        }
        
        /* Dva riadky vpravo: Pocitová teplota a vlhkosť */
        .weather-sub-row {
            font-size: clamp(1.2rem, 2.6vh, 2.1rem) !important; /* Väčší, dobre čitateľný font */
            font-weight: 700;
            display: flex !important;
            flex-direction: column !important; /* Pocitová teplota a vlhkosť pod sebou */
            align-items: flex-start !important;
            justify-content: center !important;
            gap: 6px !important; /* Medzera medzi 31° a 34% */
            line-height: 1.1 !important;
            margin-top: 0 !important;
        }
        
        .sub-row-item-temp, .sub-row-item-hum {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        #mainWeatherDesc {
            font-size: clamp(0.9rem, 2.2vh, 1.5rem) !important;
            font-weight: 800;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 1.5vh !important;
            margin-bottom: 0 !important;
            text-align: center;
            width: 100%;
            display: inline-block;
        }
        
        .main-mini-strip {
            display: flex !important;
            flex-direction: row !important; 
            justify-content: space-between;
            width: 100% !important;                    
            margin-top: 2vh !important;
            gap: 10px !important;
            padding: 0 !important;
        }
        
        .mini-day-box {
            display: flex !important;
            flex-direction: column !important;
            align-items: center;
            justify-content: center;
            flex: 1;
            background: #080808;
            border: 1px solid #111;
            padding: 8px 6px !important;
            border-radius: 10px;
            box-sizing: border-box;
            min-width: 0;
        }
        
        .mini-label { 
            font-size: clamp(0.75rem, 1.8vh, 1.1rem) !important; 
            color: #888; 
            font-weight: 800; 
            letter-spacing: 1px; 
            margin-bottom: 4px !important; 
            width: 100% !important;
            text-align: center !important;
        }
        
        .mini-data-row {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 4px !important;
            width: 100% !important;
        }
        
        #mainFc0Icon, #mainFc1Icon { font-size: clamp(1.2rem, 3vh, 2rem) !important; line-height: 1; }
        #mainFc0Temp, #mainFc1Temp { 
            font-size: clamp(0.85rem, 2.2vh, 1.3rem) !important; 
            font-weight: 800; 
            white-space: nowrap !important; 
            text-align: center !important;
        }

        .sub-row-item-temp i { color: #ffa500; margin-right: 4px; }
        .sub-row-item-hum i { color: #4dabff; margin-right: 4px; }        

        /* --- EXTRA KOMPAKTNÝ PANEL NASTAVENÍ --- */
        .settings-night-panel {
            background: #0d0d0d; 
            padding: 10px; 
            border-bottom: 2px solid #1a1a1a;
            display: flex; 
            flex-wrap: wrap; 
            flex-direction: row; 
            gap: 8px; 
            box-sizing: border-box; 
            justify-content: space-between;
        }
        
        .settings-night-row { 
            display: flex; 
            align-items: center; 
            background: #151515; 
            padding: 6px 12px; 
            border-radius: 8px; 
            border: 1px solid #222; 
            gap: 8px; 
            flex: 1; 
            min-width: calc(50% - 8px); 
            height: 48px;
            justify-content: center; 
            box-sizing: border-box;
        }
        
        .settings-night-row i.label-icon { 
            font-size: 18px !important; 
            color: #888; 
            width: 20px; 
            text-align: center; 
        }
        
        .settings-night-row button { 
            background: #222; 
            color: #fff; 
            border: 1px solid #444; 
            padding: 6px 12px; 
            border-radius: 6px; 
            font-size: 13px !important; 
            font-weight: 700 !important; 
            text-transform: uppercase !important;
            letter-spacing: 0.8px;
            cursor: pointer; 
        }
        
        #weather-history-buttons button {
            font-size: 11px !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            padding: 3px 8px !important;
        }
        .color-picker-group { display: flex; gap: 5px; align-items: center; }
        
        .color-dot { 
            width: 22px; height: 22px; border-radius: 50%; cursor: pointer; 
            border: 1px solid rgba(255,255,255,0.2); box-sizing: border-box; transition: transform 0.15s, border-color 0.15s; 
        }
        .color-dot.active-color { 
            border: 2px solid #ffffff !important; 
            transform: scale(1.25); 
            box-shadow: 0 0 4px rgba(255,255,255,0.6);
        }
                                                        
        .cfg-mini-card {
            background: #151515; border: 1px solid #252525; border-radius: 10px; aspect-ratio: 1 / 1; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; cursor: pointer; box-sizing: border-box; position: relative;
        }
        .cfg-mini-card img { width: 60%; height: 60%; object-fit: contain; }
        .cfg-mini-card i { font-size: 22px; }
        .cfg-mini-card span { font-size: 13px; text-transform: uppercase; font-weight: 600; text-align: center; color: #888; margin-top: 3px; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cfg-mini-card.selected { border: 3px solid #ff9f0a !important; background: #1a1a1a; }
        .cfg-mini-card.selected span { color: #ff9f0a; }
        .settings-label-separator { grid-column: 1 / -1; font-size: 16px; text-transform: uppercase; letter-spacing: 1.5px; color: #555; margin: 12px 0 2px 4px; font-weight: 700; border-bottom: 1px solid #1a1a1a; padding-bottom: 3px; }
    
        #nightBottomInfo { display: none; }

        /* --- INTEGRATNÝ NOČNÝ PREHRÁVAČ --- */
        .night-player-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            color: var(--night-color);
            margin-top: 1.5vh;
        }
        .night-player-station {
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .night-player-station img {
            height: 2.2rem;
            width: auto;
            object-fit: contain;
            filter: grayscale(1) brightness(1.5);
        }
        .night-player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        .night-btn {
            background: transparent;
            border: none;
            color: var(--night-color);
            font-size: 2.2rem;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        .night-btn:active { transform: scale(0.9); }
        .night-btn.btn-playpause { font-size: 2.8rem; }

        /* --- NOČNÝ REŽIM (S PLYNULÝM STMIEVANÍM) --- */
        body .placeholder-view,
        body #player-now-playing,
        body #nightBottomInfo,
        body .night-player-container {
            transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out !important;
        }
        
        body.full-night-mode .favorites-sidebar,
        body.full-night-mode .big-clock-date-wrapper,
        body.full-night-mode #settingsToggleBtn,
        body.full-night-mode .radio-trigger-bar,
        body.full-night-mode .main-weather-container { 
            display: none !important;
        }

        body.full-night-mode .big-clock-hours, 
        body.full-night-mode .big-clock-minutes, 
        body.full-night-mode #nightBottomInfo, 
        body.full-night-mode #player-now-playing { 
            color: var(--night-color) !important; 
        }
        
        body.full-night-mode #player-now-playing {
            display: block !important;
            position: relative !important;
            width: 100% !important;
            text-align: center !important;
            font-size: 1.4rem !important;
            font-weight: 500 !important;
            color: var(--night-color) !important;
            z-index: 10 !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 20px;
            box-sizing: border-box;
            margin-top: 1vh !important;
        }

        body.full-night-mode .night-player-container.active-playing {
            display: flex !important;
        }

        #bigClockCity {
            color: #ff9f0a;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: clamp(1rem, 2.5vh, 1.8rem);
            margin-bottom: 0.8vh;
            text-align: center;
            width: 100%;
        }
        /* =========================================================
           ZOBRAZENIE NA VÝŠKU (PORTRAIT)
           ========================================================= */
        @media (orientation: portrait) {
        
            /* V Portrait režime pri otvorených nastaveniach panel rádií úplne skryť */
            body:has(.settings-grid-view.active) .favorites-sidebar,
            .settings-grid-view.active ~ .favorites-sidebar {
                display: none !important;
            }
        
            /* Usporiadanie hlavného obsahu */
            .placeholder-view {
                flex-direction: column !important;
                justify-content: flex-start !important;
                align-items: center !important;
                padding: 5vh 4vw 210px 4vw !important; /* Miesto pre spodný panel */
            }
        
            .clock-middle-container {
                height: auto !important;
                width: 100% !important;
                flex: 1 !important;
                justify-content: center !important;
            }
        
            body:not(.full-night-mode) .big-clock-time {
                font-size: clamp(5rem, 18vw, 12rem) !important;
                line-height: 0.85 !important;
            }
        
            .big-clock-date-wrapper {
                font-size: clamp(1.1rem, 3.8vw, 2rem) !important;
                margin-top: 1.2vh !important;
            }
        
            .main-weather-container {
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
                flex: 1 !important;
                justify-content: center !important;
            }
        
            /* --- SPODNÝ PANEL RÁDIÍ (VŽDY VIDITEĽNÝ SPODOK) --- */
            .favorites-sidebar {
                position: fixed !important;
                top: auto !important;
                bottom: 0 !important;
                left: 0 !important;
                width: 100vw !important;
                height: 205px !important; /* Výška pre viditeľné 2 riadky (6 tlačidiel) */
                max-height: 82vh !important;
                border-right: none !important;
                border-top: 2px solid #222 !important;
                box-shadow: 0 -10px 25px rgba(0,0,0,0.9) !important;
                background: rgba(5, 5, 5, 0.98) !important;
                
                display: grid !important;
                grid-template-columns: repeat(3, 1fr) !important;
                grid-auto-rows: 76px !important; 
                padding: 20px 10px 15px 10px !important;
                gap: 8px !important;
                
                scroll-snap-type: y mandatory !important;
                
                /* ZRUŠENÝ posun preč - panel opäť trčí zo spodu */
                transform: translateY(0) !important; 
                transition: height 0.35s cubic-bezier(0.25, 1, 0.5, 1) !important;
                overflow-y: hidden !important;
            }
        
            /* VYTIAHNUTÝ STAV (po kliknutí na ikonu rádia / potiahnutí) */
            .favorites-sidebar.open {
                height: 78vh !important;

            display: flex; 
            justify-content: center; 
            gap: 24px;

        .sun-box { 
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;

            font-weight: bold; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .sun-box i, .sun-box svg {
            width: 2.4vmin; height: 2.4vmin;
            min-width: 18px; min-height: 18px;
            font-size: 2.4vmin !important;
            display: inline-block;
        }

        .sun-box-rise { color: #ff9f0a; }
        .sun-box-rise i, .sun-box-rise svg { color: #ff9f0a; stroke: #ff9f0a; animation: sunriseAnim 3.5s infinite ease-in-out; }
        .sun-box-set { color: #ff4500; }
        .sun-box-set i, .sun-box-set svg { color: #ff4500; stroke: #ff4500; animation: sunsetAnim 3.5s infinite ease-in-out; }

        @keyframes sunriseAnim {
            0%, 100% { transform: translateY(2px) scale(0.95); opacity: 0.7; }
            50% { transform: translateY(-2px) scale(1.1); opacity: 1; filter: drop-shadow(0 0 8px rgba(255, 159, 10, 0.8)); }
        }

        @keyframes sunsetAnim {
            0%, 100% { transform: translateY(-2px) scale(1.1); opacity: 1; }
            50% { transform: translateY(2px) scale(0.9); opacity: 0.6; filter: drop-shadow(0 0 0px transparent); }
        }

        #hourly-chart-container { 
            display: flex; 
            justify-content: flex-start;

        #extended-forecast-container { 
            display: grid;

        @keyframes antiBurnIn {

            20%  { transform: translate(2px, -3px); }
            40%  { transform: translate(-3px, 2px); }
            60%  { transform: translate(3px, 3px); }
            80%  { transform: translate(-2px, -2px); }
            100% { transform: translate(0, 0); }

        body.full-night-mode .placeholder-view { animation: antiBurnIn 300s infinite linear; }
        body.full-night-mode #fullscreenToggleBtn {
            background: #000 !important;
            border-color: var(--night-color) !important;

        }
            
        #mainWeatherDesc::after {

            font-size: 0.75em;
            color: #ff9f0a;
            margin-left: 8px;
            opacity: 0.8;
        }

        .tour-highlight {
            position: relative !important;

        .btn-settings i.fa-gear { transition: transform 0.5s ease-in-out; }
        .btn-settings:hover i.fa-gear, .btn-settings.active i.fa-gear { transform: rotate(180deg); }
            
        @keyframes radioGlow {
            0% { box-shadow: 0 0 5px rgba(255, 159, 10, 0.4); }

        }
        .fav-card.playing {
            border: 2px solid #ff9f0a !important;
            background: #151515;
            animation: radioGlow 2s infinite ease-in-out;
        }
            
        body, .placeholder-view, .weather-detail-view, .settings-grid-view {
            transition: background-color 0.8s ease, opacity 0.4s ease;
        }
            
        @keyframes daytimeAntiBurnIn {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(1px, -1px); }
            50%  { transform: translate(-1px, 1px); }
            75%  { transform: translate(-1px, -1px); }
            100% { transform: translate(0, 0); }
        }
        .placeholder-view { animation: daytimeAntiBurnIn 120s infinite ease-in-out; }

        /* --- ANIMÁCIE PRE IKONY POČASIA --- */
        @keyframes sunRotatePulse {
            0% { transform: scale(1) rotate(0deg); opacity: 0.95; }
            50% { transform: scale(1.08) rotate(180deg); opacity: 1; filter: drop-shadow(0 0 15px rgba(255, 204, 0, 0.8)); }
            100% { transform: scale(1) rotate(360deg); opacity: 0.95; }
        }
        
        @keyframes cloudFloat {
            0% { transform: translateX(0px) translateY(0px); }
            50% { transform: translateX(4px) translateY(-2px); }
            100% { transform: translateX(0px) translateY(0px); }
        }
        
        @keyframes rainDrop {
            0% { transform: translateY(0); }
            50% { transform: translateY(3px) scaleY(1.05); }
            100% { transform: translateY(0); }
        }
        
        @keyframes lightningFlash {
            0%, 90%, 100% { opacity: 1; filter: drop-shadow(0 0 0px transparent); }
            92% { opacity: 0.3; }
            94% { opacity: 1; filter: drop-shadow(0 0 18px #ffeb3b); }
            96% { opacity: 0.5; }
            98% { opacity: 1; filter: drop-shadow(0 0 25px #ffeb3b); }
        }
        
        #mainBigIcon { display: inline-block !important; transition: transform 0.5s ease; }
        .weather-core-row #mainBigIcon { animation: sunRotatePulse 25s infinite linear; }

        #mainBigIcon, #mainFc0Icon, #mainFc1Icon, .chart-icon-info, .forecast-day-icon {

            border-bottom: none;
            box-sizing: border-box;
            transition: height 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
    </style>

        function getTempColor(t) {
            if (t < 0) return '#00bfff';

            if (t < 22) return '#98FB98';
            if (t < 28) return '#ffa500';
            return '#ff4500';

        function getWeatherIcon(wCode) {

            if ((wCode >= 71 && wCode <= 77) || (wCode >= 85 && wCode <= 86)) return "❄️";
            if (wCode >= 95 && wCode <= 99) return "⛈️";
            return "☀️";
        }

        async function fetchWeatherData() {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${cfgLat}&longitude=${cfgLon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,precipitation,rain,showers,wind_speed_10m,wind_direction_10m&minutely_15=temperature_2m,precipitation,weather_code&hourly=temperature_2m,precipitation,cloud_cover,wind_speed_10m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=Europe%2FBratislava&wind_speed_unit=kmh&forecast_days=6`);
                const data = await response.json();
                weatherDataBackup = data;
                
                if (data && data.current) {
                    const rawTemp = data.current.temperature_2m;
                    const rawApparent = data.current.apparent_temperature;
                    const temp = Math.round(rawTemp);
                    const currentRain = (data.current.precipitation || 0) + (data.current.rain || 0) + (data.current.showers || 0);
                    const minutelyRain = data.minutely_15 && data.minutely_15.precipitation ? (data.minutely_15.precipitation[0] || 0) : 0;
                    
                    let code = data.current.weather_code;
                    
                    if ((currentRain > 0 || minutelyRain > 0) && code < 51) {
                        code = 61;
                    }
                    const humidity = Math.round(data.current.relative_humidity_2m);
                    const appTemp = Math.round(rawApparent);
                    const tColor = getTempColor(rawTemp);
                    const appColor = getTempColor(rawApparent);
                    
                    const icon = getWeatherIcon(code);
                    aktualnaTeplotaText = `${icon} ${temp}°C`;

                    const locMainText = document.getElementById('weather-location-text');
                    if (locMainText) locMainText.textContent = cfgMestoNazov.toUpperCase();

                    const bigCityEl = document.getElementById('bigClockCity');
                    if (bigCityEl) bigCityEl.textContent = cfgMestoNazov.toUpperCase();
                    
                    const mainBigIconEl = document.getElementById('mainBigIcon');
                    if (mainBigIconEl) {
                        mainBigIconEl.textContent = icon;
                        mainBigIconEl.style.animation = 'none';
                        
                        setTimeout(() => {
                            if (code === 0) {
                                mainBigIconEl.style.animation = 'sunRotatePulse 20s infinite linear';
                            } else if (code >= 1 && code <= 3) {
                                mainBigIconEl.style.animation = 'cloudFloat 4s infinite ease-in-out';
                            } else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
                                mainBigIconEl.style.animation = 'rainDrop 1.8s infinite ease-in-out';
                            } else if (code >= 95) {
                                mainBigIconEl.style.animation = 'lightningFlash 4s infinite ease-in-out';
                            } else {
                                mainBigIconEl.style.animation = 'cloudFloat 5s infinite ease-in-out';
                            }
                        }, 50);
                    }
                    
                    const mainBigTempEl = document.getElementById('mainBigTemp');
                    if (mainBigTempEl) {
                        mainBigTempEl.textContent = `${temp}°C`;
                        mainBigTempEl.style.color = tColor;
                    }

                    const mainDescEl = document.getElementById('mainWeatherDesc');
                    if (mainDescEl) mainDescEl.textContent = getWeatherText(code);
                    
                    const mainApparentEl = document.getElementById('mainApparent');
                    if (mainApparentEl) {
                        mainApparentEl.textContent = `${appTemp}°`;
                        mainApparentEl.style.color = appColor;
                    }
                    
                    const mainHumidityEl = document.getElementById('mainHumidity');
                    if (mainHumidityEl) mainHumidityEl.textContent = `${humidity}%`;

                    for (let i = 0; i <= 1; i++) {
                        const dCode = data.daily.weather_code[i];
                        const max = Math.round(data.daily.temperature_2m_max[i]);
                        const min = Math.round(data.daily.temperature_2m_min[i]);
                        
                        const mIcon = document.getElementById(`mainFc${i}Icon`);
                        if (mIcon) {
                            mIcon.textContent = getWeatherIcon(dCode);
                            priradAnimaciuIkone(mIcon, dCode);
                        }
                        
                        const mTemp = document.getElementById(`mainFc${i}Temp`);
                        if (mTemp) mTemp.innerHTML = `<span style="color:${getTempColor(max)}">${max}°</span> / <span style="color:#aaa">${min}°</span>`;
                    }

                    const weatherView = document.getElementById('weatherDetailView');
                    if (weatherView && weatherView.style.display === 'flex') {
                        vykresliGraf(aktualnyGrafMod);
                    }
                }
            } catch (e) {
                console.log("Chyba pri načítaní počasia:", e);
            }
        }
          
        function vykresliGraf(mod) {
            const chartContainer = document.getElementById('hourly-chart-container');
            if (!chartContainer || !weatherDataBackup) return;
            chartContainer.innerHTML = ''; 
        
            let temps = [], rain = [], cloud = [], wind = [], labels = [], codes = [];
            let dayIdx = (mod === 'teraz') ? 0 : mod;
            
            if (weatherDataBackup.daily && weatherDataBackup.daily.sunrise && weatherDataBackup.daily.sunset) {
                document.getElementById('sun-rise-val').textContent = weatherDataBackup.daily.sunrise[dayIdx].split('T')[1]; 
                document.getElementById('sun-set-val').textContent = weatherDataBackup.daily.sunset[dayIdx].split('T')[1];    
            }
        
            if (mod === 'teraz') {
                const currentHourIndex = new Date().getHours();
                temps = weatherDataBackup.hourly.temperature_2m.slice(currentHourIndex, currentHourIndex + 12);
                rain = (weatherDataBackup.hourly.precipitation || weatherDataBackup.hourly.rain || []).slice(currentHourIndex, currentHourIndex + 12);
                cloud = (weatherDataBackup.hourly.cloud_cover || []).slice(currentHourIndex, currentHourIndex + 12);
                wind = (weatherDataBackup.hourly.wind_speed_10m || []).slice(currentHourIndex, currentHourIndex + 12);
                codes = (weatherDataBackup.hourly.weather_code || []).slice(currentHourIndex, currentHourIndex + 12);
                
                for (let idx = 0; idx < 12; idx++) {
                    labels.push(idx === 0 ? 'Teraz' : String((currentHourIndex + idx) % 24) + ':00');
                }
            } 
            else {
                const startHourOfTargetDay = dayIdx * 24;
                for (let step = 0; step < 12; step++) {
                    const hourOffset = startHourOfTargetDay + (step * 2); 
                    temps.push(weatherDataBackup.hourly.temperature_2m[hourOffset]);
                    rain.push((weatherDataBackup.hourly.precipitation || weatherDataBackup.hourly.rain || [])[hourOffset]);
                    cloud.push((weatherDataBackup.hourly.cloud_cover || [])[hourOffset]);
                    wind.push((weatherDataBackup.hourly.wind_speed_10m || [])[hourOffset]);
                    codes.push((weatherDataBackup.hourly.weather_code || [])[hourOffset]);
                    labels.push(String(step * 2) + ':00');
                }
            }
        
            const maxGraphTemp = Math.max(...temps);
            const minGraphTemp = Math.min(...temps);
            const tempRange = (maxGraphTemp - minGraphTemp) || 1;
        
            temps.forEach((temp, idx) => {
                if (temp === undefined) return;
                const roundedTemp = Math.round(temp);
                const pct = ((temp - minGraphTemp) / tempRange) * 52 + 12;
                
                const rainVal = rain[idx] ? parseFloat(rain[idx]) : 0;
                const rainHtml = rainVal > 0 ? `<span class="chart-rain-info">💧${rainVal.toFixed(1)}</span>` : `<span class="chart-rain-info">&nbsp;</span>`;
                
                const cCode = codes[idx] !== undefined ? codes[idx] : 0;
                const weatherIconHtml = `<span class="chart-icon-info">${getWeatherIcon(cCode)}</span>`;
                
                const cloudVal = cloud[idx] ? Math.round(cloud[idx]) : 0;
                const bgOpacity = 0.05 + (cloudVal / 100) * 0.15; 
                const colBackground = `linear-gradient(to top, rgba(255,255,255, ${bgOpacity}), ${getTempColor(temp)})`;
                
                const windVal = wind[idx] ? Math.round(wind[idx]) : 0;
                const windHtml = windVal > 0 ? `<span style="font-size: 12px; color: #fff; margin-top: 5px;"><i class="fas fa-wind" style="font-size:0.8em; color:#aaa;"></i> ${windVal}</span>` : `<span style="min-height: 14px;"></span>`;
                
                const column = document.createElement('div');
                column.style.cssText = `display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; flex: 1;`;
                
                column.innerHTML = `
                    ${rainHtml}
                    ${weatherIconHtml}
                    <span class="chart-temp-info" style="color: ${getTempColor(temp)};">${roundedTemp}°</span>
                    <div class="chart-bar-fill" data-height="${pct}%" style="background: ${colBackground};"></div>
                    <span style="font-size: 14px; color: #fff; margin-top: 5px; font-weight: 500;">${labels[idx]}</span>
                    ${windHtml}
                `;
        
                const iconEl = column.querySelector('.chart-icon-info');
                if (iconEl) priradAnimaciuIkone(iconEl, cCode);
        
                chartContainer.appendChild(column);
            });
        
            setTimeout(() => {
                chartContainer.querySelectorAll('.chart-bar-fill').forEach(bar => {
                    const targetHeight = bar.getAttribute('data-height');
                    if (targetHeight) bar.style.height = targetHeight;
                });
            }, 50);
        }

        function prepniDenGrafu(e, dayIndex) {
            if (e) {
                e.stopPropagation();
                if (e.cancelable) e.preventDefault();
            }
            
            aktualnyGrafMod = dayIndex;
            vykresliGraf(dayIndex);
            
            document.querySelectorAll('.forecast-day-box').forEach(box => {
                box.classList.remove('day-box-active');
            });
            
            if (dayIndex !== 'teraz') {
                const activeBox = document.querySelector(`.forecast-day-box[data-index="${dayIndex}"]`);
                if (activeBox) activeBox.classList.add('day-box-active');
            }
            
            clearTimeout(pocasieTimer);
            pocasieTimer = setTimeout(() => { toggleWeatherView(); }, 30000);
        }

        function otvorGrafPreDen(e, denMod) {
            if (e) e.stopPropagation();
            if (isSettingsModeActive) toggleSettingsMode();
            
            const weatherView = document.getElementById('weatherDetailView');
            if (weatherView) {
                weatherView.style.display = 'flex';
                vygenerujSpodnuListuDni();
                prepniDenGrafu(null, denMod);
            }
        }
        
        function toggleWeatherView(e) {
            if (e && (e.target.closest('#settingsToggleBtn') || e.target.closest('#fullscreenToggleBtn'))) return;
            if (isSettingsModeActive) toggleSettingsMode();
            
            const weatherView = document.getElementById('weatherDetailView');
            
            if (weatherView.style.display === 'none' || weatherView.style.display === '') {
                weatherView.style.display = 'flex';
                vygenerujSpodnuListuDni();
                prepniDenGrafu(null, 'teraz');
            } else {
                clearTimeout(pocasieTimer);
                weatherView.style.display = 'none';
            }
        }

        function vygenerujSpodnuListuDni() {
            const extendedContainer = document.getElementById('extended-forecast-container');
            if (!extendedContainer || !weatherDataBackup) return;
            extendedContainer.innerHTML = ''; 
            
            const dniVTyzdni = ['Nedeľa', 'Pondelok', 'Utorok', 'Streda', 'Štvrtok', 'Piatok', 'Sobota'];
            const dnes = new Date();

            for (let i = 0; i <= 5; i++) {
                if(i >= weatherDataBackup.daily.weather_code.length) break;
                const exCode = weatherDataBackup.daily.weather_code[i];
                const max = weatherDataBackup.daily.temperature_2m_max[i];
                const min = Math.round(weatherDataBackup.daily.temperature_2m_min[i]);
                
                const buduciDen = new Date(dnes);
                buduciDen.setDate(dnes.getDate() + i);
                
                let nazovDna = "";
                if (i === 0) nazovDna = "Dnes";
                else if (i === 1) nazovDna = "Zajtra";
                else nazovDna = `${dniVTyzdni[buduciDen.getDay()]} ${buduciDen.getDate()}`;

                const dayBox = document.createElement('div');
                dayBox.className = 'forecast-day-box'; 
                dayBox.setAttribute('data-index', i);
                dayBox.setAttribute('onclick', `prepniDenGrafu(event, ${i})`);
                
                dayBox.innerHTML = `
                    <span class="forecast-day-label">${nazovDna}</span>
                    <span class="forecast-day-icon">${getWeatherIcon(exCode)}</span>
                    <div class="forecast-day-temp">
                        <span style="color:${getTempColor(max)}">${Math.round(max)}°</span>
                        <span style="color:#aaa; font-size:0.8em">/ ${min}°</span>
                    </div>
                `;
                extendedContainer.appendChild(dayBox);
                const dayIconEl = dayBox.querySelector('.forecast-day-icon');
                if (dayIconEl) priradAnimaciuIkone(dayIconEl, exCode);
            }
        }

        function inicializujPlochuNastaveni() {
            const elFrom = document.getElementById('set-night-from');
            const elTo = document.getElementById('set-night-to');
            const elSnooze = document.getElementById('set-snooze-time');
            
            if (elFrom) elFrom.textContent = cfgNocOd;
            if (elTo) elTo.textContent = cfgNocDo;
            if (elSnooze) elSnooze.textContent = cfgSnoozeMin + " min";
            
            document.documentElement.style.setProperty('--night-color', cfgFarbaNoci);
            
            function rgbToHex(rgb) {
                if (/^#[0-9A-F]{6}$/i.test(rgb)) return rgb.toLowerCase();
                const match = rgb.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
                if (!match) return rgb;
                return "#" + ("0" + parseInt(match[1],10).toString(16)).slice(-2) +
                             ("0" + parseInt(match[2],10).toString(16)).slice(-2) +
                             ("0" + parseInt(match[3],10).toString(16)).slice(-2);
            }

            document.querySelectorAll('.color-dot').forEach(dot => {
                dot.classList.remove('active-color');
                let bgStyle = dot.style.backgroundColor;
                let currentDotHex = rgbToHex(bgStyle);
                if (currentDotHex === cfgFarbaNoci.toLowerCase()) {
                    dot.classList.add('active-color');
                }
            });
        }

        function prepniDalsieMestoZHistorie(event) {
            if (event) event.stopPropagation();
            
            if (!cfgHistoriaMest || cfgHistoriaMest.length <= 1) {
                return;
            }
        
            currentCityIndex = (currentCityIndex + 1) % cfgHistoriaMest.length;
            const noveMestoNazov = cfgHistoriaMest[currentCityIndex];

            const bigCityEl = document.getElementById('bigClockCity');

                const nextIndex = (currentCityIndex + 1) % cfgHistoriaMest.length;
                const nextCityName = cfgHistoriaMest[nextIndex];
                bigCityEl.title = `Kliknutím prepnete na: ${nextCityName}`;

        function vyhladajMestoPodlaTextu(cisteMesto, jeNoveVyhladavanie = true) {
            fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cisteMesto)}&count=1&language=sk&format=json`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.results && data.results.length > 0) {
                        const najdene = data.results[0];
                        cfgLat = najdene.latitude;
                        cfgLon = najdene.longitude;
                        cfgMestoNazov = najdene.name;
                        
                        localStorage.setItem('cfg_weather_lat', cfgLat);
                        localStorage.setItem('cfg_weather_lon', cfgLon);
                        localStorage.setItem('cfg_weather_name', cfgMestoNazov);
                        
                        if (jeNoveVyhladavanie) {
                            cfgHistoriaMest = cfgHistoriaMest.filter(m => m.toLowerCase() !== cfgMestoNazov.toLowerCase());
                            cfgHistoriaMest.unshift(cfgMestoNazov);
                            
                            if (cfgHistoriaMest.length > 5) cfgHistoriaMest.pop();
                            currentCityIndex = 0;
                        } else {
                            currentCityIndex = cfgHistoriaMest.findIndex(m => m.toLowerCase() === cfgMestoNazov.toLowerCase());
                            if (currentCityIndex === -1) currentCityIndex = 0;
                        }
        
                        localStorage.setItem('cfg_weather_history', JSON.stringify(cfgHistoriaMest));
                        localStorage.setItem('cfg_city_index', currentCityIndex);
                        
                        aktualizujTooltipMesta();
                        aktualizujTlacidloMesta();
                        fetchWeatherData();
                    } else {
                        alert(`Mesto "${cisteMesto}" sa nenašlo.`);
                    }
                })
                .catch(e => console.log("Chyba geokódovania:", e));
        }

        function handleChannelSelectionToggle(id) {
            const existingIndex = slotFavorites.indexOf(id);
            
            if (existingIndex !== -1) {
                // Ak je stanica zrušená:
                if (existingIndex < 6) {
                    // Ak je v prvej šestke, nahradíme ju voľným slotom (null), aby držala pozíciu pre novú stanicu
                    slotFavorites[existingIndex] = null;
                } else {
                    // Ak je od 7. pozície nižšie, normálne ju odstránime
                    slotFavorites.splice(existingIndex, 1);
                }
            } else {
                // Ak pridávame novú stanicu:
                // Najprv skontrolujeme, či je voľné miesto (null) v prvej šestke (1 - 6)
                let freeSlotIndex = -1;
                for (let i = 0; i < 6; i++) {
                    if (slotFavorites[i] === null || slotFavorites[i] === undefined) {
                        freeSlotIndex = i;
                        break;
                    }
                }
        
                if (freeSlotIndex !== -1) {
                    // Vložíme ju na prvé voľné číslo (napr. na uvoľnenú pozíciu 2)
                    slotFavorites[freeSlotIndex] = id;
                } else {
                    // Ak sú pozície 1 - 6 plné, pridáme ju na koniec zoznamu
                    slotFavorites.push(id);
                }
            }
            
            localStorage.setItem('kiosk_slots_v2', JSON.stringify(slotFavorites));
            renderSidebarFavorites();
            renderSettingsGrid();
            resetSettingsTimer();
        }
        
        function toggleFullscreenMode() {
            const doc = window.document;
            const docEl = doc.documentElement;
            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
            const fsBtn = document.getElementById('fullscreenToggleBtn');
            const fsIcon = document.getElementById('fullscreenIcon');

            if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                if (requestFullScreen) {
                    requestFullScreen.call(docEl);
                    if (fsBtn) fsBtn.classList.add('active');
                    if (fsIcon) { fsIcon.classList.remove('fa-expand'); fsIcon.classList.add('fa-compress'); }
                }
            } else {
                if (cancelFullScreen) {
                    cancelFullScreen.call(doc);
                    if (fsBtn) fsBtn.classList.remove('active');
                    if (fsIcon) { fsIcon.classList.remove('fa-compress'); fsIcon.classList.add('fa-expand'); }
                }
            }
        }

            const placeholder = document.getElementById('rightPlaceholder');
            const gridView = document.getElementById('settingsGridView');
            const weatherView = document.getElementById('weatherDetailView');

        function handleFavCardClick(item) {
            if (isSettingsModeActive) return;
        
            if (item.url) {
                if (currentPlayingType === item.id) {
                    audio.pause(); 
                    document.getElementById("player-now-playing").innerText = "";
                } else {
                    // --- DYNAMICKÝ POSUN LEN PRE 3. POZÍCIU A NIŽŠIE ---
                    const isPortrait = window.matchMedia("(orientation: portrait)").matches;
                    if (isPortrait) {
                        let currentIndex = slotFavorites.indexOf(item.id);
                        
                        if (currentIndex > 2) {
                            slotFavorites.splice(currentIndex, 1);
                            slotFavorites.splice(2, 0, item.id);
                            localStorage.setItem('kiosk_slots_v2', JSON.stringify(slotFavorites));
                        }
                    }
        
                    if (item.icon && (item.id === 'spotify' || item.id === 'applemusic' || item.id === 'youtube' || item.id === 'tidal')) {
                        triggerExternalApp(item.url, item.id);
                    } else {
                        playRadio(item.url, item.id);
                    }
                }
            }
        
            const sidebar = document.getElementById('favSidebarContainer');
            if (sidebar) {
                // Zavrieme panel a resetujeme skrolovanie na samý vrch (prvé 2 riadky)
                sidebar.classList.remove('open');
                setTimeout(() => {
                    sidebar.scrollTop = 0;
                }, 300); // Počkám na dokončenie vysúvacej animácie
            }
            
            renderSidebarFavorites();
            aktualizujTriggerText();
        }

        function aktualizujZamknutuObrazovku(idRadia) {
            if ('mediaSession' in navigator) {
                const hrajuceRadio = DATABASE.find(d => d.id === idRadia);
                const nazovRadia = hrajuceRadio ? hrajuceRadio.name : idRadia.toUpperCase();
                const ikonaRadia = hrajuceRadio && hrajuceRadio.img ? hrajuceRadio.img : "https://raw.githubusercontent.com/zmobilu/assets/main/kiosk-ikona.png";

                navigator.mediaSession.metadata = new MediaMetadata({
                    title: nazovRadia,
                    artist: 'Živé vysielanie',
                    album: 'Meteo 📻',
                    artwork: [ { src: ikonaRadia, sizes: '512x512', type: 'image/png' } ]
                });

                navigator.mediaSession.setActionHandler('play', () => { audio.play(); });
                navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); });
                navigator.mediaSession.setActionHandler('nexttrack', () => { spustiDalsieRadio('vpred'); });
                navigator.mediaSession.setActionHandler('previoustrack', () => { spustiDalsieRadio('vzad'); });
            }
        }
        
        function spustiDalsieRadio(smer) {
            if (!currentPlayingType || currentPlayingType === "") return;
            let currentIndex = slotFavorites.indexOf(currentPlayingType);
            if (currentIndex === -1) return;

            let novyIndex = currentIndex;
            let najdeneRadio = null;

            for (let i = 0; i < 6; i++) {
                novyIndex = (smer === 'vpred') ? (novyIndex + 1) % 6 : (novyIndex - 1 + 6) % 6;
                const idKandidata = slotFavorites[novyIndex];
                if (!idKandidata) continue;

                const item = DATABASE.find(d => d.id === idKandidata);
                if (item && item.url && !item.url.includes('googleusercontent.com') && !item.url.includes('music.apple.com') && !item.url.includes('music.youtube.com') && !item.url.includes('tidal.com') && !item.url.includes('soundcloud.com')) {
                    najdeneRadio = item;
                    break;
                }
            }

            if (najdeneRadio) {
                playRadio(najdeneRadio.url, najdeneRadio.id);
            }
        }
        
        function playRadio(url, id) {
            audio.src = url;
            audio.load();
            sledujStreamMetadat(url);
            currentPlayingType = id;
            localStorage.setItem('kiosk_last_radio_url', url);
            localStorage.setItem('kiosk_last_radio_type', id);
            audio.volume = VOLUME_MAP[id] !== undefined ? VOLUME_MAP[id] : 1.0;
            audio.play()
            .then(() => {
                if (typeof noSleep !== 'undefined') {
                    noSleep.enable().catch(e => console.log("WakeLock chyba:", e));
                }
                renderSidebarFavorites();
                runClockEngine(); 
                aktualizujZamknutuObrazovku(id);
                aktualizujNochnyPrehravacVizual();
            })
            .catch((e) => console.log("Stream offline", e));
        }

            if (typeof noSleep !== 'undefined') {

            }

            if (document.body.classList.contains('full-night-mode')) {
                manualnaNocAktivna = false;

                document.body.classList.remove('full-night-mode');

                manualnaNocAktivna = true;
                runClockEngine();
            }

        function runClockEngine() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            
            skontrolujAObnovMeniny();
            
            const aktCasString = `${h}:${m}`;
            document.getElementById('bigHours').textContent = h;
            document.getElementById('bigMinutes').textContent = m;
            
            const dniDlhe = ['Nedeľa', 'Pondelok', 'Utorok', 'Streda', 'Štvrtok', 'Piatok', 'Sobota'];
            const aktDatumString = `${now.getDate()}.${now.getMonth() + 1}.`;
            const aktFullDateString = `${dniDlhe[now.getDay()]} ${now.getDate()}.${now.getMonth() + 1}.${now.getFullYear()}`;
            
            const bigDateEl = document.getElementById('bigDate');
            if(bigDateEl) bigDateEl.textContent = aktFullDateString;

            const topDateEl = document.getElementById('weather-location-date');
            const topTimeEl = document.getElementById('weather-location-time');
            if (topDateEl) topDateEl.textContent = aktDatumString;
            if (topTimeEl) topTimeEl.textContent = aktCasString;

            const aktualnyCasVMinutach = now.getHours() * 60 + now.getMinutes();
            const terazMili = Date.now();

            const [odH, odM] = cfgNocOd.split(':').map(Number);
            const [doH, doM] = cfgNocDo.split(':').map(Number);
            const [casOd, casDo] = [odH * 60 + odM, doH * 60 + doM];

            let jeNocnyCas = (casOd > casDo) 
                ? (aktualnyCasVMinutach >= casOd || aktualnyCasVMinutach < casDo)
                : (aktualnyCasVMinutach >= casOd && aktualnyCasVMinutach < casDo);

            const bodyEl = document.body;

                    const ikonkaW = aktualnaTeplotaText.split(' ')[0] || "☀️";
            
                    bottomInfoEl.innerHTML = `${meninyNocturnalText}${dniDlhe[now.getDay()]} ${now.getDate()}.${now.getMonth() + 1.}    •    ${ikonkaW} <span style="color: ${tColorNoc}; font-weight: 700;">${lenCisloTeploty}°C</span>`;
                }
            } else {
                bodyEl.classList.remove('full-night-mode');
                if (bottomInfoEl) bottomInfoEl.style.display = "none";
                if (!jeNocnyCas) manualnaNocAktivna = false;
            }
            
            let stavRadia = "Rádio";
            if (currentPlayingType && currentPlayingType !== "") {

        async function fetchNamedayData() {
            const now = new Date();
            poslednyNacitanyDen = now.getDate();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            try {
                const response = await fetch('https://raw.githubusercontent.com/spacek/slovensky-kalendar-menin/master/sk-meniny.csv');
                const text = await response.text();
                for (let line of text.split('\n')) {
                    if (line.includes(`${mm}-${dd}`)) {
                        let rawNamesLine = line.split(/[;,]/).slice(1).join(',');
                        dnesneVsetkyMena = rawNamesLine.split(',').map(m => m.trim()).filter(m => m !== "");

                        if (dnesneVsetkyMena.length === 0) return;

                        let povodneMeno = dnesneVsetkyMena[0];
                        dnesneMeno = povodneMeno; 
                        
                        const bigNameday = document.getElementById('bigNameday');
                        const sep = document.getElementById('dateSeparator');
                        
                        if(sep) sep.style.display = "inline";
                        bigNameday.style.color = "#ff9f0a";

                        if (RODINA.includes(povodneMeno)) {
                            dnesneMeno = `❤️ ${povodneMeno}`;
                            bigNameday.style.color = "#ff3b30";
                        } else if (MOJE_MENA.includes(povodneMeno)) {
                            dnesneMeno = `⭐ ${povodneMeno}`;
                        } else if (SPOLUZIACI.includes(povodneMeno)) {
                            dnesneMeno = `🎓 ${povodneMeno}`;
                            bigNameday.style.color = "#5ac8fa";
                        } else if (KOLEGOVIA.includes(povodneMeno)) {
                            dnesneMeno = `💼 ${povodneMeno}`;
                            bigNameday.style.color = "#34c759";
                        }

                        if (dnesneVsetkyMena.length > 1) {
                            const pocetDalsich = dnesneVsetkyMena.length - 1;
                            bigNameday.innerHTML = `${dnesneMeno} <span style="color: #666; font-size: 0.8em; font-weight: normal; margin-left: 4px;">+${pocetDalsich}</span>`;
                        } else {

                        bigNameday.style.cursor = 'pointer';

        let metadataController = null;

        async function sledujStreamMetadat(streamUrl) {
            const textElement = document.getElementById("player-now-playing");
            if (textElement) textElement.innerText = "";
            
            if (metadataController) {
                metadataController.abort();
                metadataController = null;
            }
            
            if (bauerIntervalId) {
                clearInterval(bauerIntervalId);
                bauerIntervalId = null;
            }
            
            metadataController = new AbortController();
            const localSignal = metadataController.signal;
        
            if (currentPlayingType === 'rock') {
                const nacitajRockPiesen = async () => {
                    if (localSignal.aborted || currentPlayingType !== 'rock') return;
            
                    try {
                        const targetUrl = encodeURIComponent('https://www.radia.sk/radia/rock/playlist');
                        const res = await fetch(`https://api.allorigins.win/get?url=${targetUrl}`, { signal: localSignal });
                        const data = await res.json();
            
                        if (localSignal.aborted || currentPlayingType !== 'rock') return;
            
                        if (data && data.contents) {
                            const parser = new DOMParser();
                            const doc = parser.parseFromString(data.contents, 'text/html');
                            const prvyRiadok = doc.querySelector('#playlist_table .row.data');
            
                            if (prvyRiadok) {
                                const artist = prvyRiadok.querySelector('.interpret')?.textContent.trim() || '';
                                const song = prvyRiadok.querySelector('.titul')?.textContent.trim() || '';
            
                                textElement.innerText = (artist || song) ? `${artist} - ${song}` : "";
                                return;
                            }
                        }
                        textElement.innerText = "";
                    } catch (e) {
                        if (e.name !== 'AbortError') {
                            console.log("Radia.sk Rock Parsing Error:", e);
                            textElement.innerText = "";
                        }
                    }
                };
            
                await nacitajRockPiesen();
                bauerIntervalId = setInterval(nacitajRockPiesen, 30000);
                return;
            }

            const sroMap = {
                'slovensko': { domain: 'slovensko.stvr.sk', channel: 12 },
                'fm':        { domain: 'fm.stvr.sk',        channel: 5 },
                'devin':     { domain: 'devin.stvr.sk',     channel: 3 },
                'regina':    { domain: 'reginazapad.stvr.sk', channel: 1 }
            };
            
            if (sroMap[currentPlayingType]) {
                const stanica = sroMap[currentPlayingType];
                const spustenaStanicaType = currentPlayingType; 
            
                const nacitajSroPlaylist = async () => {
                    if (localSignal.aborted || currentPlayingType !== spustenaStanicaType) return;
            
                    try {
                        const playlistUrl = `https://${stanica.domain}/json/snippet/radio_playlist.json?channel=${stanica.channel}`;
                        const targetUrl = encodeURIComponent(playlistUrl);
                        
                        const res = await fetch(`https://api.allorigins.win/get?url=${targetUrl}`, { signal: localSignal });
                        const data = await res.json();
                        
                        if (localSignal.aborted || currentPlayingType !== spustenaStanicaType) return;
            
                        if (data && data.contents) {
                            const jsonData = JSON.parse(data.contents);
                            const htmlSnippet = jsonData.snippets?.['snippet-playlist'];
            
                            if (htmlSnippet) {
                                const parser = new DOMParser();
                                const doc = parser.parseFromString(htmlSnippet, 'text/html');
                                const firstItem = doc.querySelector('li.list');
            
                                if (firstItem) {
                                    const artist = firstItem.querySelector('.title')?.textContent.trim() || '';
                                    const song = firstItem.querySelector('.song')?.textContent.trim() || '';
                                    
                                    textElement.innerText = (artist || song) ? `${artist} - ${song}` : "";
                                    return;
                                }
                            }
                        }
                        textElement.innerText = "";
                    } catch (e) {
                        if (e.name !== 'AbortError') {
                            console.log("STVR API Error:", e);
                            textElement.innerText = "";
                        }
                    }
                };
            
                await nacitajSroPlaylist();
                bauerIntervalId = setInterval(nacitajSroPlaylist, 30000);
                return;
            }

            try {
                await new Promise(resolve => setTimeout(resolve, 1500));
                if (localSignal.aborted) return;

                const response = await fetch(streamUrl, {
                    headers: { 'Icy-Metadata': '1' },
                    signal: localSignal 
                }).catch(err => {
                    throw new Error("CORS_OR_NETWORK_ERROR");
                });
        
                const metaInt = parseInt(response.headers.get('icy-metaint'));
                if (!metaInt) {
                    textElement.innerText = "";
                    return;
                }
        
                const reader = response.body.getReader();
                let buffer = new Uint8Array();
        
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
        
                    let newBuffer = new Uint8Array(buffer.length + value.length);
                    newBuffer.set(buffer);
                    newBuffer.set(value, buffer.length);
                    buffer = newBuffer;
        
                    while (buffer.length > metaInt) {
                        const metaLengthByte = buffer[metaInt];
                        const metaLength = metaLengthByte * 16; 
        
                        if (buffer.length >= metaInt + 1 + metaLength) {
                            if (metaLength > 0) {
                                const metaBytes = buffer.subarray(metaInt + 1, metaInt + 1 + metaLength);
                                const decoder = new TextDecoder('utf-8');
                                const metaString = decoder.decode(metaBytes);
        
                                const match = metaString.match(/StreamTitle='(.*?)';/);
                                if (match && match[1]) {
                                    const cistyNazov = match[1].trim();
                                    textElement.innerText = cistyNazov !== "" ? cistyNazov : "";
                                }
                            }
                            buffer = buffer.subarray(metaInt + 1 + metaLength);
                        } else {
                            break;
                        }
                    }
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.log("Metadáta nedostupné (CORS/Network):", error.message);
                    textElement.innerText = "";
                }
            }
        }

            } else if (wCode >= 1 && wCode <= 3) {
                element.style.animation = 'cloudFloat 4s infinite ease-in-out';
